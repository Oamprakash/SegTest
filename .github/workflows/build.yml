name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Imaging unit tests (JVM)
        run: gradle :core:imaging:testDebugUnitTest --stacktrace

      - name: Build release APK (debug-signed, not debuggable)
        run: gradle assembleRelease --stacktrace

      # Run the image pipeline on a real Android graphics stack before publishing anything.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pipeline tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace

      - name: Report emulator test counts
        run: |
          files=$(find . -path '*build/outputs/androidTest-results/connected*' -name '*.xml')
          if [ -z "$files" ]; then echo "::error::No emulator test results found"; exit 1; fi
          t=0; fl=0
          for f in $files; do
            t=$((t + $(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc 0-9)))
            fl=$((fl + $(grep -o 'failures="[0-9]*"' "$f" | head -1 | tr -dc 0-9)))
          done
          u=$(find core -path '*build/test-results/testDebugUnitTest*' -name '*.xml' -exec cat {} + | grep -c '<testcase')
          echo "::notice title=Tests::emulator $t tests, $fl failures; JVM ${u:-0} tests"
          [ "$t" -gt 0 ] && [ "$fl" -eq 0 ]

      - uses: actions/upload-artifact@v4
        with:
          name: segtest-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Re-publish a "latest" pre-release so the APK can be downloaded straight to a phone.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          cp app/build/outputs/apk/release/app-release.apk "segtest-${GITHUB_SHA::7}.apk"
          gh release create latest "segtest-${GITHUB_SHA::7}.apk" \
            --title "Latest build" \
            --notes "Build ${GITHUB_SHA::7} (shown at the top of the app). Uninstall the previous build first: each CI build is signed with a fresh debug key." \
            --prerelease
