name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK (debug-signed, not debuggable)
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: segtest-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Re-publish a "latest" pre-release so the APK can be downloaded straight to a phone.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          cp app/build/outputs/apk/release/app-release.apk "segtest-${GITHUB_SHA::7}.apk"
          gh release create latest "segtest-${GITHUB_SHA::7}.apk" \
            --title "Latest build" \
            --notes "Build ${GITHUB_SHA::7} (shown at the top of the app). Uninstall the previous build first: each CI build is signed with a fresh debug key." \
            --prerelease
